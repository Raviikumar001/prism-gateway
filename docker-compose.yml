services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
      POSTGRES_DB: prism
    ports:
      - "5432:5432"
    volumes:
      - prism_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-alpha:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
    command: ["python3", "scripts/mock_provider.py", "--port", "9001", "--name", "alpha"]
    ports:
      - "9001:9001"

  mock-beta:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
    command: ["python3", "scripts/mock_provider.py", "--port", "9002", "--name", "beta"]
    ports:
      - "9002:9002"

  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://prism:prism@postgres:5432/prism?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-change-me}
      PROVIDER_MODE: ${PROVIDER_MODE:-mocks}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      DATA_DIR: /data
      # Override to /data/gateway_config.live.json for live; default stays mocks.
      GATEWAY_CONFIG: ${GATEWAY_CONFIG:-/data/gateway_config.docker.json}
      LOG_LEVEL: info
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT:-120s}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-alpha:
        condition: service_started
      mock-beta:
        condition: service_started

volumes:
  prism_pg:
